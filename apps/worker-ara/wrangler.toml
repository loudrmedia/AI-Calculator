# Must stay in sync with NEXT_PUBLIC_WORKER_URL on the Pages project, which the
# live site has baked in as ai-calculator-web-ara.getloud.workers.dev. Renaming
# this deploys a *new* worker and silently leaves the site pointing at the old one.
name = "ai-calculator-web-ara"
main = "src/index.ts"
compatibility_date = "2024-05-12"

[vars]
ENVIRONMENT = "production"

# Rate limiting configuration
# [unsafe]
# bindings = [
#   { name = "RATE_LIMITER", class_name = "RateLimiter" }
# ]

# Secrets (set via wrangler secret put):
# - ZAPIER_WEBHOOK_URL
# - WEBHOOK_SECRET
